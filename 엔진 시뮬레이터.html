<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>엔진 시뮬레이터</title>
<style>
:root{--view:#f0eee9;--vink:#6b6e6a;--panel:#171c1b;--panel2:#121716;--line:#2c3533;--ink:#dfe5e0;--dim:#8c9792;--acc:#ff6a3d;--ok:#9bd37a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--panel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--view:#262b2a;--vink:#9aa39f}}
:root[data-theme="dark"]{--view:#262b2a;--vink:#9aa39f}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:170px;background:var(--view);position:relative}
#eng{width:100%;height:100%;display:block}
#hint{position:absolute;left:16px;bottom:10px;font-size:13px;color:var(--vink)}
#dash{background:var(--panel);padding:8px 14px 14px}
#lights{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-bottom:10px}
#lights i{height:7px;border-radius:2px;border:1px solid var(--line);transition:background .05s}
.gauges{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;align-items:center}
.gauges canvas{width:100%;aspect-ratio:1;display:block}
.mid{background:var(--panel2);border:1px solid var(--line);border-radius:14px;height:100%;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#gbig{font-size:64px;line-height:1;font-weight:500;color:#e8efe6}
.temp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.temp b{position:relative;width:64px;height:3px;background:#3a4543;border-radius:2px}
#tbar{position:absolute;top:-4px;width:3px;height:11px;background:var(--acc);border-radius:2px;left:30%}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;margin-top:8px}
.bar button.m{background:none;border:0;color:var(--ok);font-size:16px;font-weight:600;padding:8px 4px;display:flex;align-items:center;gap:10px}
.knob{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a5452,#1a201f);border:1px solid var(--line);position:relative;transition:transform .2s}
.knob:after{content:"";position:absolute;left:50%;top:5px;width:3px;height:10px;margin-left:-1.5px;background:#dfe5e0;border-radius:2px}
.pw{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}
#pwr{width:52px;height:52px;border-radius:50%;border:3px solid #4a5a50;background:#2a1b17;color:var(--acc);display:grid;place-items:center;padding:0}
#pwr.on{border-color:var(--ok);color:var(--ok);background:#18261a}
.ctrl{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.gear h4,.ped h4{margin:0 0 8px;font-weight:400;font-size:15px;color:var(--dim);display:flex;justify-content:space-between}
.gear h4 span{color:var(--ink);font-weight:600}
.gb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gb button,.pm button{height:44px;border-radius:10px;border:1px solid var(--line);background:#252d2c;color:var(--ink);font-size:16px}
.gb button.sel{background:var(--acc);border-color:var(--acc);color:#1b0f0b;font-weight:700}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pm button{height:84px;font-size:26px}
button:active{filter:brightness(1.3)}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.ped{text-align:center}
.pedal{background:#0b0f0e;border-radius:16px;padding:8px 8px 6px;touch-action:none}
.pad{height:116px;border-radius:8px;background:linear-gradient(90deg,#9ea39d,#d9dcd6 50%,#9ea39d);display:flex;flex-direction:column;justify-content:space-evenly;padding:10px;transition:transform .05s;transform-origin:50% 100%}
.pad i{display:block;height:5px;border-radius:3px;background:#222}
.pv{font:13px ui-monospace,Menlo,monospace;color:var(--dim);margin-top:6px}
.foot{margin-top:12px;font-size:12px;color:var(--dim);text-align:center}
@media (max-height:700px){#gbig{font-size:48px}.pad{height:84px}.pm button{height:62px}}
#pwr{position:relative}
#pwr::after{content:"";position:absolute;inset:-6px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--ok) calc(var(--p,0)*1%),transparent 0);-webkit-mask:radial-gradient(circle farthest-side,transparent 86%,#000 88%);mask:radial-gradient(circle farthest-side,transparent 86%,#000 88%)}
#pwr.acc{border-color:#d9a93a;color:#d9a93a;background:#2a2412}
.gauges,#lights,.mid{transition:opacity .3s}
#dash.off .gauges,#dash.off #lights{opacity:.22}
#hint{background:rgba(0,0,0,.55);color:#fff;padding:5px 10px;border-radius:8px;bottom:12px;max-width:calc(100% - 32px)}
#hint:empty{display:none}
.foot select{background:#252d2c;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;margin-bottom:4px}
.foot div{margin-top:3px}
.key{display:flex;align-items:center;gap:6px;background:#1d2322;border:1px solid var(--line);border-radius:14px;padding:4px 10px 4px 2px}
.kk{position:relative;width:86px;height:80px;flex:none}
.kl{position:absolute;font-size:8.5px;font-weight:700;font-style:normal;color:#7d8782}
.kl.a{color:#ffb02e}.l0{left:0;top:24px}.l1{left:12px;top:8px}.l2{left:40px;top:1px}.l3{right:0;top:13px}
.kk #pwr{position:absolute;left:17px;top:22px;width:54px;height:54px;border:2px solid #343d3b;background:radial-gradient(circle at 35% 30%,#1c2120,#050707)}
#slot{display:block;width:7px;height:28px;border-radius:4px;background:linear-gradient(90deg,#7d8782,#c3cac6,#7d8782);transition:transform .18s}
#ps{font-size:11px;font-weight:600;line-height:1.35;color:var(--dim);width:74px}
#warn{display:flex;justify-content:space-between;margin:10px 2px 0}
.lp{width:26px;height:26px;color:#2b3331;transition:color .12s}.lp svg{width:100%;height:100%}
.lp.red.on{color:#ff4a3a;filter:drop-shadow(0 0 4px #ff4a3a88)}
.lp.amb.on{color:#ffb02e;filter:drop-shadow(0 0 4px #ffb02e88)}
.lp.fl.on{animation:bl .8s steps(1) infinite}@keyframes bl{50%{opacity:.2}}
#dash.off #warn{opacity:.4}
</style></head>
<body><div id="app">
<section id="view"><canvas id="eng"></canvas><div id="hint">키: 짧게 누르면 LOCK→ACC→ON, 브레이크를 밟고 1.5초 길게 누르면 START</div></section>
<section id="dash">
<div id="lights"></div>
<div class="gauges"><canvas id="gs"></canvas>
<div class="mid"><div id="gbig">P</div><div class="temp">C<b><i id="tbar"></i></b>H</div></div>
<canvas id="gr"></canvas></div>
<div id="warn"></div>
<div class="bar"><button class="m" id="mode"><span class="knob" id="knob"></span><span id="mt">컴포트</span></button>
<div class="pw"><div class="key"><div class="kk"><i class="kl l0">LOCK</i><i class="kl l1">ACC</i><i class="kl l2">ON</i><i class="kl l3">START</i><button id="pwr" aria-label="시동 키"><i id="slot"></i></button></div><span id="ps"></span></div></div></div>
<div class="ctrl">
<div class="gear"><h4>기어 <span id="gl">P</span></h4>
<div class="gb"><button data-g="P" class="sel">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button></div>
<div class="pm"><button id="dn" aria-label="시프트 다운">−</button><button id="up" aria-label="시프트 업">+</button></div></div>
<div class="ped"><h4 style="justify-content:center">브레이크</h4><div class="pedal" id="bp"><div class="pad" id="bpad"><i></i><i></i><i></i><i></i></div><div class="pv" id="bv">0%</div></div></div>
<div class="ped"><h4 style="justify-content:center">스로틀</h4><div class="pedal" id="tp"><div class="pad" id="tpad"><i></i><i></i><i></i><i></i></div><div class="pv" id="tv">0%</div></div></div>
</div>
<div class="foot"><label>차종 <select id="veh"></select></label><div id="spec"></div><div>D에서 +/−는 수동 변속, D를 다시 누르면 자동</div></div>
</section></div>
<script>
const $=i=>document.getElementById(i),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let RATIO,REV,FINAL,R,IDLE,LIM,MASS,V;
/* 최종감속비(final)는 자료에 없어 추정값(3.9)입니다. 차종 추가: 아래 배열에 객체 하나만 더하면 선택 목록에 나타납니다.
   ratio=기어비(1단부터), rev=후진비, final=종감속비, r=타이어 반경(m), mass=공차중량(kg),
   idle/lim=공회전/리미터 rpm, tq=최대토크(Nm), pk=최대토크 rpm, cd=공기저항 계수, body=차체 색 */
const VEHICLES=[
 {name:'현대 에쿠스 JS380 (F5AH1)',spec:'3.8 람다 V6 GDi · 5단 자동 F5AH1',ratio:[3.840,2.140,1.440,1.000,.708],rev:3.497,final:3.9,r:.35,mass:1900,idle:700,lim:6800,tq:380,pk:5000,cd:.36,vmax:250,body:'#1d1f24',ord:3},
 {name:'현대 에쿠스 JS380 (F5A51)',spec:'3.8 람다 V6 GDi · 5단 자동 F5A51',ratio:[3.789,2.162,1.421,1.000,.686],rev:3.117,final:3.9,r:.35,mass:1900,idle:700,lim:6800,tq:380,pk:5000,cd:.36,vmax:250,body:'#3a3f47',ord:3},
 {name:'인라인6 트윈 (기본)',spec:'직렬 6기통 트윈터보 · 7단 DCT',ratio:[3.8,2.5,1.8,1.4,1.1,.9,.75],rev:3.4,final:3.6,r:.34,mass:1500,idle:850,lim:7600,tq:700,pk:5200,cd:.72,body:'#b3261e',ord:3}
];
function applyVehicle(i){const v=VEHICLES[i];V=v;RATIO=[0,...v.ratio];REV=v.rev;FINAL=v.final;R=v.r;IDLE=v.idle;LIM=v.lim;MASS=v.mass;
  Object.assign(S,{gear:1,rpm:0,on:false,ign:0,crk:0,man:false,v:0,sel:'P'});
  document.querySelectorAll('.gb button').forEach(b=>b.classList.toggle('sel',b.dataset.g==='P'));$('spec').textContent=v.spec}
function vehInit(){const el=$('veh');VEHICLES.forEach((v,i)=>el.add(new Option(v.name,i)));
  el.onchange=()=>{if(Math.abs(S.v)>.3){msg('정지한 뒤 차종을 바꿔주세요');el.value=VEHICLES.indexOf(V);return}applyVehicle(+el.value)};applyVehicle(0);lampInit()}
const MODES=[{n:'에코',up:4300,dn:1300},{n:'컴포트',up:6200,dn:1700},{n:'스포츠',up:7300,dn:2600}];
const S={ign:0,acc:0,fast:0,on:false,crk:0,rpm:0,v:0,gear:1,sel:'P',man:false,thr:0,brk:0,shT:0,cutT:0,temp:.25,mode:1,th:0};
const H={thr:false,brk:false};
const tq=r=>V.tq*Math.max(.35,1-Math.pow((r-V.pk)/V.pk,2));
let tm;function msg(t){const h=$('hint');h.textContent=t;clearTimeout(tm);tm=setTimeout(()=>h.textContent='',2200)}
// 기어 선택
function selGear(g){
  if(g==='P'&&Math.abs(S.v)>.6)return msg('주행 중에는 P로 바꿀 수 없어요');
  if((g==='D'&&S.v<-1)||(g==='R'&&S.v>1))return msg('완전히 멈춘 뒤 바꿔주세요');
  if(g==='D'){let k=1;if(Math.abs(S.v)>1)for(let i=RATIO.length-1;i>=1;i--){if(Math.abs(S.v)/R*RATIO[i]*FINAL*9.549<=5000){k=i;break}}S.gear=k}
  S.sel=g;S.man=false;
  document.querySelectorAll('.gb button').forEach(b=>b.classList.toggle('sel',b.dataset.g===g));
}
function manual(d){
  if(S.sel!=='D')return msg('D에서만 수동 변속할 수 있어요');
  S.man=true;const o=S.gear,g=cl(o+d,1,RATIO.length-1);
  if(g===o)return msg(d>0?'최고단이에요':'1단이에요');
  if(d<0&&S.rpm*RATIO[g]/RATIO[o]>LIM-300)return msg('RPM이 너무 높아 다운시프트할 수 없어요');
  S.gear=g;S.rpm=Math.max(IDLE,S.rpm*RATIO[g]/RATIO[o]);   // 즉시 변속: RPM도 바로 새 기어비로
  if(d>0)S.cutT=.1;S.shT=.3;msg('M · '+g+'단');
}
document.querySelectorAll('.gb button').forEach(b=>b.onclick=()=>S.ign?selGear(b.dataset.g):msg('ACC를 켜야 기어를 바꿀 수 있어요'));
[['up',1],['dn',-1]].forEach(([i,d])=>$(i).addEventListener('pointerdown',e=>{e.preventDefault();unlock();manual(d)}));
$('mode').onclick=()=>{S.mode=(S.mode+1)%3;$('mt').textContent=MODES[S.mode].n;$('knob').style.transform=`rotate(${(S.mode-1)*50}deg)`};
const HOLD=1500,IGNITE=.95;let hold=null;
/* 키: 짧게 = LOCK→ACC→ON→LOCK, 브레이크 밟고 길게 = START(크랭킹). IGNITE=크랭킹 시간(초) */
function tryStart(){
  if(S.crk>0||S.on)return;
  if(S.sel!=='P'&&S.sel!=='N')return msg('P 또는 N에서 시동을 걸어주세요');
  if(S.brk<.3)return msg('브레이크를 밟은 채 1.5초간 길게 누르세요');
  S.ign=2;S.crk=IGNITE;stopSnd(.05);playStart(buf2);msg('START · 크랭킹');
}
function tapKey(){
  if(S.crk>0)return;
  if(S.on){if(Math.abs(S.v)>.5)return msg('주행 중에는 시동을 끌 수 없어요');selGear('P');S.on=false;S.ign=0;stopSnd(.2);return msg('LOCK')}
  S.ign=(S.ign+1)%3;
  if(S.ign===1){playStart();msg('ACC · 전원 ON, 경고등 점등')}
  else if(S.ign===2)msg('ON · 브레이크를 밟고 길게 누르면 START');
  else{stopSnd(.2);msg('LOCK')}
}
const pw=$('pwr');
pw.addEventListener('pointerdown',e=>{unlock();pw.setPointerCapture(e.pointerId);hold={t:performance.now(),done:false}});
pw.addEventListener('pointerup',()=>{if(!hold)return;const h=hold;hold=null;pw.style.setProperty('--p',0);if(!h.done&&(S.on||performance.now()-h.t<HOLD))tapKey()});
pw.addEventListener('pointercancel',()=>{hold=null;pw.style.setProperty('--p',0)});
function holdTick(){
  if(!hold||hold.done||S.on||S.crk>0)return;
  const p=(performance.now()-hold.t)/HOLD;pw.style.setProperty('--p',Math.min(100,p*100));
  if(p>=1){hold.done=true;pw.style.setProperty('--p',0);tryStart()}
}
// 페달: 누르는 동안 스로틀처럼 서서히 밟힘
function pedal(id,k){const e=$(id);
  e.addEventListener('pointerdown',ev=>{e.setPointerCapture(ev.pointerId);H[k]=true});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>e.addEventListener(t,()=>H[k]=false));
  e.addEventListener('contextmenu',ev=>ev.preventDefault())}
pedal('tp','thr');pedal('bp','brk');
const KM={ArrowUp:'thr',w:'thr',ArrowDown:'brk',s:'brk',' ':'brk'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){H[k]=true;e.preventDefault()}
  const u=e.key.toUpperCase();if('PRND'.includes(u)&&u.length===1)selGear(u);
  if(e.key==='+'||e.key==='=')manual(1);if(e.key==='-')manual(-1)});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)H[k]=false});
// 사운드: ACC/시동음(파일) + 에쿠스 배기음(녹음 분석 기반 소스-필터 모델)
let au=null,buf=null,buf2=null;
/* 배기음: 발화 임펄스열(주파수=rpm/60×발화차수) → 녹음에서 추출한 배기관 공명 IR 컨볼루션 */
/* 배기음: 녹음(60~260km/h 가속, 시동2)을 차수 분석한 표. 주파수 = 차수 × rpm/120, 진폭은 rpm 대역별로 보간 */
const ORD={"rpm":[1475.647058823535,5000.0,5500.0,6000.0,6500.0],"db":[[-62,-49,-40,-41,-43,-28,-45,-46,-24,-43,-38,-20,-38,-41,-23,-40,-46,-29,-39,-41,-38,-40,-45,-42,-47,-51,-44,-54,-52,-46,-49,-52,-49,-52,-47,-45,-44,-44,-41,-40,-40,-44,-44,-44,-45,-45,-48,-51,-51,-54,-53,-52,-45,-45,-44,-47,-47,-48,-49,-46,-46,-46,-48,-51],[-26,-22,-22,-22,-32,-33,-35,-22,-37,-36,-38,-26,-34,-32,-37,-35,-44,-42,-43,-38,-43,-47,-45,-49,-50,-48,-48,-48,-50,-50,-48,-49,-51,-49,-48,-49,-52,-51,-49,-48,-51,-53,-54,-55,-56,-55,-56,-57,-58,-58,-58,-58,-59,-57,-57,-57,-57,-57,-55,-54,-54,-54,-53,-53],[-28,-21,-22,-26,-37,-37,-39,-26,-39,-34,-37,-29,-40,-36,-38,-40,-44,-40,-43,-42,-50,-48,-50,-52,-50,-48,-49,-50,-50,-49,-50,-50,-50,-50,-50,-50,-51,-52,-52,-53,-53,-54,-55,-56,-56,-56,-55,-55,-55,-55,-55,-55,-55,-55,-54,-55,-53,-52,-52,-53,-53,-54,-55,-57],[-28,-21,-23,-25,-39,-36,-38,-27,-34,-27,-34,-30,-38,-35,-40,-43,-45,-40,-49,-45,-49,-49,-49,-48,-48,-47,-47,-49,-50,-48,-50,-47,-48,-49,-52,-52,-52,-53,-54,-54,-54,-54,-54,-53,-53,-54,-54,-54,-54,-53,-53,-52,-51,-51,-51,-52,-52,-53,-53,-55,-56,-57,-56,-57],[-29,-20,-24,-27,-40,-34,-40,-24,-36,-26,-39,-30,-38,-40,-41,-41,-46,-41,-50,-47,-50,-46,-47,-46,-49,-48,-46,-49,-51,-47,-49,-50,-50,-50,-52,-52,-54,-56,-55,-54,-54,-54,-54,-53,-54,-54,-54,-54,-54,-52,-50,-51,-51,-54,-54,-54,-56,-56,-56,-57,-58,-59,-59,-60]]};
const KN=64,OL=ORD.db.map(r=>r.map(v=>Math.pow(10,v/20)));
function orderAmps(rpm,thr,out){
  const R=ORD.rpm;let i=0;while(i<R.length-2&&rpm>R[i+1])i++;
  const w=cl((rpm-R[i])/(R[i+1]-R[i]),0,1),a=OL[i],b=OL[i+1];
  const load=cl((rpm-1800)/2200,0,1)*(1-thr)*.65,lv=(1-load)*(.55+.45*Math.min(1,rpm/1500));
  for(let k=0;k<KN;k++)out[k]=(a[k]*(1-w)+b[k]*w)*lv}
function initAudio(){if(au)return;let C;
  try{C=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  au={C,f:null,g:null,g2:null};
  try{
    const f=C.createBiquadFilter(),g=C.createGain(),sh=C.createWaveShaper(),sp=C.createScriptProcessor(2048,1,1);
    const tb=new Float32Array(4096);for(let i=0;i<4096;i++)tb[i]=Math.sin(i/4096*6.2831853);
    const ph=new Float64Array(KN).map(()=>Math.random()),amp=new Float32Array(KN),tg=new Float32Array(KN);
    f.type='lowpass';f.frequency.value=6000;g.gain.value=0;
    const cur=new Float32Array(1024);for(let i=0;i<1024;i++)cur[i]=Math.tanh(1.5*(i/511.5-1));sh.curve=cur;
    sp.onaudioprocess=e=>{const o=e.outputBuffer.getChannelData(0),n=o.length,sr=C.sampleRate;o.fill(0);
      if(!S.on){amp.fill(0);return}
      const fc=Math.max(S.rpm,300)/120;orderAmps(S.rpm,S.thr,tg);
      for(let k=0;k<KN;k++){const inc=(k+1)*fc/sr;if(inc>.45)break;let p=ph[k],a=amp[k];const da=(tg[k]-a)/n;
        for(let i=0;i<n;i++){o[i]+=a*tb[(p*4096)|0];a+=da;p+=inc;if(p>=1)p-=1}

function lampInit(){$('warn').innerHTML=LAMPS.map(l=>`<i class="lp ${l[1]}" id="lp_${l[0]}" title="${l[2]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${l[3]}</svg></i>`).join('')}
/* 경고등: ACC/ON(엔진 정지·크랭킹)에서는 전부 점등, 시동 후에는 순차 소등되어 일부(안전벨트, P단 주차 등)만 남음 */
function warnUI(){
  S.run=S.on?(S.run||0)+DT:0;const r=S.run,run=S.on,bulb=S.ign>=1&&!run;
  const st={chk:bulb||(run&&(r<2.5||S.rpm>LIM-50)),oil:bulb,bat:bulb,cool:bulb||(run&&S.temp>.85),
    brk:bulb||(run&&S.sel==='P'),abs:bulb||(run&&r<1.2),air:bulb||(run&&r<3),belt:bulb||run,esc:bulb||(run&&r<1.2),tp:bulb||(run&&r<2)};
  for(const l of LAMPS){const e=$('lp_'+l[0]);e.classList.toggle('on',!!st[l[0]])}
  $('lp_belt').classList.toggle('fl',run&&Math.abs(S.v)*3.6>20);
}
function keyUI(){
  const pos=S.crk>0?3:S.on?2:S.ign;
  $('dash').classList.toggle('off',S.ign===0&&!S.on);
  $('slot').style.transform='rotate('+[-60,-32,0,38][pos]+'deg)';
  document.querySelectorAll('.kl').forEach((e,i)=>e.classList.toggle('a',i===pos));
  $('ps').textContent=S.crk>0?'크랭킹…':S.on?'키 · 짧게: 끄기':['짧게: 돌리기 · 길게: START','ACC · 짧게: 돌리기','ON · 길게: START'][S.ign];
}
function frame(){
  $('lights').children.length||0;
  const r=S.rpm/8000;[...$('lights').children].forEach((e,i)=>{const on=r*16>i;e.style.background=on?(i<9?'#9bd37a':i<13?'#f0b445':'#ff4a3a'):'transparent'});
  gauge($('gs'),Math.abs(S.v)*3.6,320,[0,80,160,240,320],16,'km/h',Math.round(Math.abs(S.v)*3.6));
  gauge($('gr'),S.rpm/1000,8,[0,1,2,3,4,5,6,7,8],16,'rpm',Math.round(S.rpm),(LIM-600)/8000);
  scene();
  $('gbig').textContent=S.sel==='D'?S.gear:S.sel;
  $('gl').textContent=S.sel==='D'?`Gear ${S.gear}${S.man?' (M)':''}`:S.sel;
  $('tbar').style.left=cl(S.temp,0,1)*92+'%';
  $('tpad').style.transform=`scaleY(${1-S.thr*.14})`;$('bpad').style.transform=`scaleY(${1-S.brk*.14})`;
  $('tv').textContent=Math.round(S.thr*100)+'%';$('bv').textContent=Math.round(S.brk*100)+'%';
  keyUI();warnUI();
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;DT=dt;step(dt);holdTick();frame();sound();requestAnimationFrame(loop)}
function init(){const L=$('lights');for(let i=0;i<16;i++)L.appendChild(document.createElement('i'));['gs','gr','eng'].forEach(i=>fit($(i)))}
vehInit();init();addEventListener('resize',()=>['gs','gr','eng'].forEach(i=>fit($(i))));requestAnimationFrame(loop);
